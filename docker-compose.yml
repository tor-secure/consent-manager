services:
  postgres:
    image: postgres:18
    container_name: consent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: consent_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: consent_platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - consent_postgres_data:/var/lib/postgresql

volumes:
  consent_postgres_data:
